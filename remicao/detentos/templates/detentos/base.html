<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Remição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-black text-white d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Sistema de Remição</span>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">Home</a>
                <a href="/detentos/" class="btn btn-outline-light btn-sm">Detentos</a>
                <a href="/consulta/" class="btn btn-outline-light btn-sm">Consulta</a>
                <a href="/admin/" class="btn btn-outline-warning btn-sm">Admin</a>

                {% if user.is_authenticated %}
                <span class="text-white">Usuário: {{ user.username }}</span>
                <a href="/logout/" class="btn btn-danger btn-sm">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center my-4">
        {% block content %}
        {% endblock %}
    </div>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
